<svg xmlns="http://www.w3.org/2000/svg" width="660" height="330" viewBox="0 0 660 330">
<rect width="660" height="330" fill="#FAF9F5"/>
<g font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif">
  <rect x="0" y="0" width="660" height="36" fill="#F0EEE6"/>
  <text x="56" y="24" font-size="16" font-weight="800" fill="#2B2A27">문서 도우미</text>
  <!-- 질문 -->
  <rect x="276" y="50" width="340" height="40" rx="10" fill="#141413"/>
  <text x="294" y="76" font-size="17" fill="#FAF9F5">연차는 몇 일 전에 신청해야 하나요?</text>
  <!-- 답변 -->
  <rect x="48" y="104" width="420" height="80" rx="10" fill="#FFFFFF" stroke="#DEDCD3" stroke-width="1.5"/>
  <rect x="62" y="116" width="104" height="24" rx="12" fill="#F0EEE6"/>
  <text x="114" y="133" font-size="15" font-weight="800" fill="#2B2A27" text-anchor="middle">근거 2건</text>
  <text x="62" y="165" font-size="17" fill="#2B2A27">3일 전까지 메신저 결재로 신청합니다.</text>
  <!-- 근거 카드 -->
  <rect x="48" y="200" width="200" height="72" rx="8" fill="#FFFFFF" stroke="#6B6A64" stroke-width="1.5"/>
  <text x="62" y="228" font-size="16" font-weight="800" fill="#2B2A27">휴가 규정 v4</text>
  <text x="62" y="254" font-size="15" fill="#6B6A64">2026.03 개정 · 2조</text>
  <rect x="262" y="200" width="200" height="72" rx="8" fill="#FFFFFF" stroke="#DEDCD3" stroke-width="1.5"/>
  <text x="276" y="228" font-size="16" font-weight="800" fill="#2B2A27">결재 안내</text>
  <text x="276" y="254" font-size="15" fill="#6B6A64">위키 · 인사팀</text>
  <!-- 피드백 -->
  <rect x="48" y="288" width="96" height="30" rx="15" fill="#F0EEE6"/>
  <text x="96" y="308" font-size="15" font-weight="700" fill="#2B2A27" text-anchor="middle">도움 됨</text>
  <rect x="154" y="288" width="96" height="30" rx="15" fill="#F0EEE6"/>
  <text x="202" y="308" font-size="15" font-weight="700" fill="#2B2A27" text-anchor="middle">틀렸어요</text>
</g>
</svg>
