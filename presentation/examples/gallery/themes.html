<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>색 테마</title>
  <style>
    :root{--ink:#141413;--body:#2B2A27;--muted:#57554F;--paper:#FFFFFF;--line:#D6D3CA;--card:#F1F0EB;--accent:#D97757;--accent-dark:#9A4022;--accent-soft:#F5E3DA}
    *{box-sizing:border-box}
    body{margin:0;background:var(--paper);color:var(--body);font-family:Pretendard,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;line-height:1.5}
    .wrap{max-width:1240px;margin:0 auto;padding-inline:24px}
    header.top{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
    .bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:14px}
    .bar h1{margin:0;font-size:22px;letter-spacing:-.03em;color:var(--ink)}
    .bar h1 span{color:var(--accent-dark)}
    .back{margin-left:auto;font-size:14px;font-weight:800;color:var(--accent-dark)}
    .opts{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding-bottom:14px}
    .group{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
    .group > span{margin-right:2px;font-weight:700}
    .group button{flex:none;white-space:nowrap;padding:5px 12px;border:1px solid var(--line);border-radius:999px;background:var(--paper);color:var(--body);font:inherit;font-size:14px;font-weight:700;cursor:pointer}
    .group button:hover{border-color:var(--accent)}
    .group button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
    .info{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:8px 32px;padding:24px 0 18px;align-items:start}
    .info h2{margin:0;font-size:30px;letter-spacing:-.04em;color:var(--ink)}
    .info .use{margin:2px 0 8px;font-weight:800;color:var(--body)}
    .info p{margin:0 0 6px}
    .info dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px}
    .info dt{font-weight:900;color:var(--ink)}
    .info dd{margin:0}
    code{font-family:ui-monospace,Menlo,monospace;font-size:.9em;background:var(--card);padding:.1em .35em;border-radius:4px}
    .hint{margin:0 0 14px;font-size:14px;color:var(--muted)}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:18px;padding-bottom:40px}
    .grid.pairs{grid-template-columns:auto repeat(2,minmax(0,1fr));align-items:center;max-width:1000px}
    .grid.pairs .col{font-size:14px;font-weight:900;color:var(--ink);text-align:center}
    .grid.pairs .row{font-size:14px;font-weight:800;color:var(--ink);max-width:6em;word-break:keep-all}
    .shot{display:block;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;color:inherit;text-decoration:none;cursor:pointer}
    .shot:hover{border-color:var(--accent)}
    .shot .frame{position:relative;aspect-ratio:16/9;background:#000}
    .shot iframe{position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none}
    .shot b{display:block;padding:8px 12px;font-size:14px;color:var(--ink)}
    .grid.pairs .shot b{display:none}
    footer.end{padding:0 0 40px;color:var(--muted);font-size:14px}
    /* 크게 보기 — 새 탭으로 넘어가지 않고 이 페이지 위에 띄운다 */
    .viewer{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;background:var(--ink)}
    .viewer.open{display:flex}
    .viewer-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:12px 18px;color:var(--paper)}
    .viewer-bar strong{margin-right:auto;font-size:17px;letter-spacing:-.02em}
    .viewer-bar a,.viewer-bar button{padding:6px 12px;border:1px solid rgba(255,255,255,.3);border-radius:999px;background:transparent;color:var(--paper);font:inherit;font-size:14px;font-weight:700;text-decoration:none;cursor:pointer}
    .viewer-bar a:hover,.viewer-bar button:hover{border-color:var(--accent);color:#fff}
    .viewer-bar .close{font-size:18px;line-height:1;padding:6px 11px}
    .viewer-stage{flex:1;min-height:0;display:grid;place-items:center;padding:0 18px 18px}
    .viewer-frame{width:min(100%, calc((100vh - 84px) * 16 / 9));aspect-ratio:16/9;border:0;background:#000;border-radius:6px;pointer-events:none;outline:1px solid rgba(255,255,255,.18)}
    body.viewing{overflow:hidden}
    @media (max-width:760px){header.top{position:static}.info{grid-template-columns:1fr}.back{margin-left:0}.viewer-bar strong{flex-basis:100%}}
  </style>
</head>
<body>
  <header class="top"><div class="wrap">
    <div class="bar">
      <h1>색 <span>테마</span></h1>
      <a class="back" href="index.html">← 장 갤러리로</a>
    </div>
    <div class="opts">
      <div class="group" id="pick-theme" role="group" aria-label="테마"><span>테마</span></div>
      <div class="group" id="pick-paper" role="group" aria-label="모드"><span>모드</span>
        <button data-mode="" aria-pressed="true">라이트</button>
        <button data-mode="dark" aria-pressed="false">다크</button>
        <button data-mode="both" aria-pressed="false">나란히</button>
      </div>
    </div>
  </div></header>

  <main class="wrap">
    <section class="info" id="info" aria-live="polite"></section>
    <p class="hint" id="hint"></p>
    <div class="grid" id="grid"></div>
  </main>
  <footer class="end wrap">정의 위치: <code>assets/starter/presentation.html</code>의 <code>[data-theme]</code>·<code>[data-mode]</code> 블록 · 새 테마 만드는 법: <code>references/build.md</code> "색 바꾸기"</footer>

  <div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-labelledby="viewer-title">
    <div class="viewer-bar">
      <strong id="viewer-title"></strong>
      <button id="viewer-prev" aria-label="이전">← 이전</button>
      <button id="viewer-next" aria-label="다음">다음 →</button>
      <a id="viewer-tab" target="_blank" rel="noopener">새 탭으로</a>
      <button class="close" id="viewer-close" aria-label="닫기">×</button>
    </div>
    <div class="viewer-stage" id="viewer-stage"><iframe class="viewer-frame" id="viewer-frame" title="크게 보기" tabindex="-1"></iframe></div>
  </div>

  <script>
    /* [값, 이름, 용도, 설명, 어울리는 발표, 피할 때] — 테마를 더하면 여기와 스타터 CSS 에 한 줄씩 */
    const THEMES = [
      ['', 'clay', '기본 · 제안·결과 보고', '따뜻한 주황 강조와 베이지 카드의 편집물 톤. report 스킬과 같은 강조색이라 보고서와 함께 발표할 때 이어진다.',
       '제안서, 결과 보고, 내부 리뷰', '아주 기술적인 아키텍처 설명은 ocean이 더 차분하다'],
      ['ocean', 'ocean', '기술 설명 · 아키텍처 · 데이터', '차분한 파랑. 구조도·표·코드가 많은 덱에서 강조가 튀지 않고 신뢰감이 있다.',
       '시스템 설계 리뷰, 데이터 분석 공유, 기술 세미나', '감정에 호소해야 하는 피치는 signal'],
      ['duo', 'duo', '강의 · 교육 · 비교', '남색 갈래 A와 먹색 갈래 B로 "이쪽/저쪽"이 갈리고, 짚는 곳은 자홍 한 곳으로 또렷하다.',
       '강의 자료, 개념 비교, 전후 대비가 많은 교육 덱', '비교가 거의 없는 덱은 남색이 남는다 — clay·ocean이 더 조용하다'],
      ['forest', 'forest', '운영 현황 · 성과 보고', '안정적인 초록. 숫자와 진척을 차분하게 보여주고, 긍정적인 결과 보고에 어울린다.',
       '분기 운영 보고, 프로젝트 진척, 지속 과제 공유', '위험·경고가 핵심인 보고는 clay나 signal'],
      ['signal', 'signal', '피치 · 키노트 · 외부 발표', '회색 없이 검정·빨강 고대비. 빨강 강조가 강해서 하나만 써도 강하게 각인된다.',
       '외부 발표, 투자·사업 피치, 행사 키노트', '빨강을 여러 곳에 쓰면 경고처럼 읽힌다 — 강조는 꼭 한 곳'],
    ];
    /* 테마마다 보여 줄 장 — [파일, 장 번호, 이름]. 팔레트 + 색 역할이 드러나는 장 6개 */
    const SAMPLES = [['palette.html', 0, '팔레트'], ['presentation.html', 1, '표지'], ['presentation.html', 5, '구조 설명'],
      ['presentation.html', 7, '코드 설명'], ['presentation.html', 17, '분석 그림'], ['presentation.html', 18, '구성과 상태'], ['presentation.html', 22, '결정 요청']];

    const read = k => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } };
    const save = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
    let theme = read('gallery-theme'), paper = read('themes-mode') === 'both' ? 'both' : (read('gallery-mode') === 'dark' ? 'dark' : '');   // 라이트·다크는 갤러리와 같은 값을 쓴다
    if (!THEMES.some(t => t[0] === theme)) theme = '';

    /* 덱에는 테마·모드를 주소 옵션으로 넘긴다 — 덱 파일은 고치지 않는다 (paper 변수 = 모드) */
    const qs = (p, embed) => { const o = [embed && 'embed', theme && 'theme=' + theme, p && 'mode=' + p].filter(Boolean).join('&'); return o ? '?' + o : ''; };
    const url = (file, n, p, embed) => file + qs(p, embed) + (n ? '#' + n : '');

    const pickTheme = document.getElementById('pick-theme');
    pickTheme.insertAdjacentHTML('beforeend', THEMES.map(t => `<button data-theme="${t[0]}">${t[1]}${t[0] ? '' : '(기본)'}</button>`).join(''));

    let items = [];   // 지금 화면의 카드 순서 = 크게 보기의 이전/다음 순서
    function render() {
      const [t, name, use, desc, good, avoid] = THEMES.find(x => x[0] === theme);
      const attr = [t && `data-theme="${t}"`, paper === 'dark' && 'data-mode="dark"'].filter(Boolean).join(' ');
      document.getElementById('info').innerHTML = `
        <div><h2>${name}</h2><p class="use">${use}</p><p>${desc}</p></div>
        <dl><dt>어울리는 발표</dt><dd>${good}</dd><dt>피할 때</dt><dd>${avoid}</dd>
            <dt>덱에 쓰기</dt><dd><code>&lt;html lang="ko"${attr ? ' ' + attr : ''}&gt;</code></dd></dl>`;
      document.getElementById('hint').textContent = paper === 'both'
        ? '왼쪽 라이트 · 오른쪽 다크. 밝은 회의실·인쇄·PDF 배포는 라이트, 어두운 강당·대형 화면·개발자 행사는 다크가 눈이 편하다. 카드를 누르면 크게 열린다(← → · Esc · ×).'
        : '카드를 누르면 크게 열린다. ← → 로 넘기고 Esc나 × 로 닫는다.';
      const grid = document.getElementById('grid');
      const card = (it, k) => `<a class="shot" data-k="${k}" href="${url(it.file, it.n, it.p)}" aria-label="${name} ${it.p ? '다크' : '라이트'} · ${it.label}">
          <div class="frame"><iframe loading="lazy" tabindex="-1" title="${it.label}" src="${url(it.file, it.n, it.p, true)}"></iframe></div><b>${it.label}</b></a>`;
      if (paper === 'both') {
        items = SAMPLES.flatMap(([file, n, label]) => [{file, n, label, p: ''}, {file, n, label, p: 'dark'}]);
        grid.className = 'grid pairs';
        grid.innerHTML = '<span></span><span class="col">라이트</span><span class="col">다크</span>' +
          SAMPLES.map(([, , label], i) => `<span class="row">${label}</span>` + card(items[2 * i], 2 * i) + card(items[2 * i + 1], 2 * i + 1)).join('');
      } else {
        items = SAMPLES.map(([file, n, label]) => ({file, n, label, p: paper}));
        grid.className = 'grid';
        grid.innerHTML = items.map(card).join('');
      }
      pickTheme.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.theme === theme)));
      document.querySelectorAll('#pick-paper button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === paper)));
    }
    pickTheme.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; theme = b.dataset.theme; save('gallery-theme', theme); render(); });
    document.getElementById('pick-paper').addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      paper = b.dataset.mode; save('themes-mode', paper); if (paper !== 'both') save('gallery-mode', paper); render();
    });

    const viewer = document.getElementById('viewer'), frame = document.getElementById('viewer-frame');
    let current = 0;
    function openAt(k) {
      current = (k + items.length) % items.length;
      const it = items[current], name = THEMES.find(x => x[0] === theme)[1];
      document.getElementById('viewer-title').textContent = `${name}${it.p ? ' · 다크' : ''} · ${it.label}`;
      document.getElementById('viewer-tab').href = url(it.file, it.n, it.p);
      frame.src = url(it.file, it.n, it.p, true);
      viewer.classList.add('open'); document.body.classList.add('viewing');
      document.querySelectorAll('header.top, main, footer.end').forEach(el => el.inert = true);
      document.getElementById('viewer-close').focus();
    }
    function closeViewer() {
      viewer.classList.remove('open'); document.body.classList.remove('viewing');
      document.querySelectorAll('header.top, main, footer.end').forEach(el => el.inert = false);
      frame.src = 'about:blank';
      const seen = document.querySelector(`.shot[data-k="${current}"]`); if (seen) seen.focus();
    }
    document.getElementById('grid').addEventListener('click', e => {
      const a = e.target.closest('.shot');
      if (!a || e.metaKey || e.ctrlKey || e.shiftKey || matchMedia('(max-width:640px)').matches) return;   // 수정키·휴대폰 폭은 새 탭
      e.preventDefault(); openAt(+a.dataset.k);
    });
    document.getElementById('viewer-close').onclick = closeViewer;
    document.getElementById('viewer-prev').onclick = () => openAt(current - 1);
    document.getElementById('viewer-next').onclick = () => openAt(current + 1);
    document.getElementById('viewer-stage').addEventListener('click', e => { if (e.target.id === 'viewer-stage') closeViewer(); });
    addEventListener('keydown', e => {
      if (!viewer.classList.contains('open')) return;
      if (e.key === 'Escape') closeViewer();
      if (e.key === 'ArrowRight') { e.preventDefault(); openAt(current + 1); }
      if (e.key === 'ArrowLeft') { e.preventDefault(); openAt(current - 1); }
      if (e.key === 'Tab') {
        const f = [...viewer.querySelectorAll('button, a[href]')], i = f.indexOf(document.activeElement);
        if (e.shiftKey && i <= 0) { e.preventDefault(); f[f.length - 1].focus(); }
        else if (!e.shiftKey && i === f.length - 1) { e.preventDefault(); f[0].focus(); }
      }
    });
    render();
  </script>
</body>
</html>
